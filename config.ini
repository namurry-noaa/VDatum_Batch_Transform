# ============================================================================
# VDatum Batch Transform - configuration
# ----------------------------------------------------------------------------
# Batch transform tidal datums to NAVD88 with tidal datum values from the 
# NOAA CO-OPS Tides & Currents page, or the NOAA VDatum tool's  API
# fallback when T&C lacks the value.
#
# Edit the values below, then run:
#     python vdatum_batch_transform.py --config config.ini
# ============================================================================

[input]
# Path to the source table. Accepted formats: .csv, .ods, .xlsx (auto-detected
# by extension). Read-only; the source file is never modified.
# ONE FILE PER RUN: the tool processes only this file (it does not scan a
# directory). To do several sheets, run once per file, each with its own
# [output] basename so results don't overwrite each other.
file = data/PJH_Points.ods
# Sheet/tab name to read (used for .ods/.xlsx only; ignored for .csv).
sheet = All Stations
# REQUIRED columns — the header names in your file that identify each station.
# The file MUST contain a header row with these three columns:
#     station id, latitude (decimal deg), longitude (decimal deg, negative W).
# Change the values on the right to match your file's headers.
station_id_col = Station ID
latitude_col   = Latitude
longitude_col  = Longitude
# OPTIONAL descriptive columns carried through, unchanged, into the output
# (comma separated). Missing ones are warned about and left blank. Leave empty
# if none.
passthrough_cols = Region, Station Name

[output]
# Directory for all generated files (created if missing). Source data untouched.
dir = output
# Base name for output files (results + exceptions get suffixes).
basename = user_transformed_pts
# Units for datum values: metric (meters) or english (feet).
units = metric

[datums]
# --- Tidal (source) datum pulled from CO-OPS ---
# The single tidal datum that acts as the "zero plane". CO-OPS datum
# abbreviation. Main options: MLLW, MLW, MSL, MTL, MHW, MHHW, STND.
tidal_datum = MLLW
# --- Geodetic (target) datum(s) ---
# One or more comma-separated CO-OPS/VDatum datum abbreviations. For each
# target, the tool emits its own column block. Values come from the T&C
# metadata API when published, else the VDatum fallback.
#   Common geodetic targets: NAVD88
#   (NAPGD2022 is not yet on the VDatum API; a separate extractor exists.)
geodetic_datums = NAVD88
# (Legacy single-target key 'geodetic_datum' is still accepted if
#  'geodetic_datums' is absent.)

[vdatum]
# Used ONLY as a fallback when a station has the tidal_datum but NOT a given
# geodetic target published in CO-OPS. Transforms (tidal_datum, z=0) -> target.
#
# Horizontal reference frame of the input lat/lon (VDatum s_h_frame).
s_h_frame = NAD83_2011
# Input / output epoch (decimal year). Nominal 2010.0 for NAD83(2011).
epoch_in  = 2010.0
epoch_out = 2010.0
# Source vertical frame = the tidal datum acting as zero (VDatum s_v_frame).
s_v_frame = MLLW
# NOTE: the VDatum TARGET vertical frame (t_v_frame) is set per geodetic target
# from [datums] geodetic_datums — no separate t_v_frame key is needed.
# Geoid model for the transformation (VDatum s_v_geoid / t_v_geoid).
geoid = geoid18
# Region handling: "auto" tries each region below until one succeeds;
# or set a single region name to force it (e.g. contiguous).
region = auto
# Ordered list of regions to try when region = auto (comma separated).
# See https://vdatum.noaa.gov/docs/services.html for the full list.
# NOTE: Some regional tidal grids REQUIRE a specific input horizontal frame
# (e.g. chesapeak_delaware requires IGS14 for tidal transforms). Use the
# region:frame syntax below to override s_h_frame for a given region. A bare
# region name uses the default s_h_frame above.
region_try_order = contiguous, chesapeak_delaware:IGS14, westcoast, wgom, ak, seak, prvi, hi, as, gcnmi

[api]
# Identifier sent to CO-OPS logs (their "application" param). Please set to
# your org / app / name per CO-OPS API guidance.
application = CO-OPS_VDatum_Batch_Transform
# Seconds to sleep between successive API calls (CO-OPS throttling courtesy).
sleep_between_calls = 0.5
# Per-request timeout (seconds) and retry count for transient failures.
timeout = 30
max_retries = 3
# The VDatum API sometimes returns a transient "Uncaught error, please contact
# NOAA VDatum Program Support team." fault. Retry that specific fault this many
# times (with exponential backoff) before treating it as a persistent server
# bug and adding it to the bug-report file.
vdatum_server_retries = 3

[health]
# The VDatum API is known to be intermit at times.  The tool runs a "canary"
# transform of a known-good point to tell # a genuine VDatum outage or 
# error apart from legitimately out-of-domain stations.
#
# Enable/disable the canary health check.
canary_enabled = true
# Known-good point + target that should ALWAYS succeed when VDatum is up.
# Default is the point from VDatum's own API docs (contiguous, NAD83_2011).
canary_region  = contiguous
canary_s_x     = -75.211
canary_s_y     = 36.129
canary_s_v_frame = NAVD88
canary_t_v_frame = MLLW
# If, at the end of the run, the fraction of VDatum calls that hit a
# server/API error (NOT clean out-of-domain) meets/exceeds this threshold AND
# the end-of-run canary also fails, the tool prints a loud "VDatum likely DOWN"
# warning. Range 0.0-1.0.
down_error_rate = 0.90

